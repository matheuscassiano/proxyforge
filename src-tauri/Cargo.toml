[package]
name = "proxyforge"
version = "0.1.1"
description = "Open-source desktop proxy card printer"
authors = ["ProxyForge contributors"]
license = "GPL-3.0-or-later"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "proxyforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25.10"
fast_image_resize = { version = "6.1.0", features = ["image", "rayon"] }
lcms2 = "6.2.0"
pdf-writer = "0.15.0"
miniz_oxide = "0.9.1"
png = "0.18.1"
tiff = "0.11.3"
rayon = "1.12.0"
sha2 = "0.11.1"
hex = "0.4.3"
thiserror = "2.0.21"
regex = "1.13.1"
quick-xml = "0.42.0"
base64 = "0.23.1"
parking_lot = "0.13.0"
once_cell = "1.21.4"
zip = "9.7.0"
uuid = { version = "1.29.3", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
tokio = { version = "1.54.1", features = ["full"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "brotli", "http2", "query"] }
tauri-plugin-dialog = "2.8.4"
ttf-parser = "0.25.1"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
lopdf = "0.47.0"
tempfile = "3.27.0"
